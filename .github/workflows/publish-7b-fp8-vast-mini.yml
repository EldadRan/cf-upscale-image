# Publish `ghcr.io/<owner>/cf-upscale-7b-fp8-vast-mini` — the Vast stills worker: 7B fp8 mixed on Vast's `mini` PyTorch image.
#
# **X2 (CF, 2026-11-22): one workflow per image, named by the model it holds and the base it is built
# on**, so every row in the Actions list says which image it made. No inputs: the pair is written
# here, and `build.yml` refuses a package name that does not describe it. The build itself is
# `build.yml`, shared by every caller; nothing about HOW an image is built belongs in this file.
name: publish cf-upscale-7b-fp8-vast-mini
run-name: publish cf-upscale-7b-fp8-vast-mini @ ${{ github.ref_name }} ${{ github.sha }}

on:
  workflow_dispatch:

# **Its own group, so the two images never cancel each other**; two dispatches of THIS image on one
# ref still supersede, since they race to push the same `:latest`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      package: cf-upscale-7b-fp8-vast-mini
      base_image: vastai/pytorch:2.8.0-cu128-cuda-12.9-mini-py311-2026-10-23
      seedvr2_model: seedvr2_ema_7b_fp8_e4m3fn_mixed_block35_fp16.safetensors
